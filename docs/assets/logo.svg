<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#181926" />
      <stop offset="60%" stop-color="#0E0F17" />
      <stop offset="100%" stop-color="#07070B" />
    </radialGradient>

    <!-- Squircle Border Stroke -->
    <linearGradient id="squircleStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D3148" />
      <stop offset="100%" stop-color="#12131C" />
    </linearGradient>

    <!-- Left Prism Facet Gradient -->
    <linearGradient id="leftFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="50%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>

    <!-- Center Prism Face Gradient -->
    <linearGradient id="centerFacet" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="30%" stop-color="#9333EA" />
      <stop offset="70%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4338CA" />
    </linearGradient>

    <!-- Right Tip Facet Gradient -->
    <linearGradient id="rightFacet" x1="0%" y1="20%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="45%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>

    <!-- Specular Highlight for Top Bevel -->
    <linearGradient id="topBevel" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#E9D5FF" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.6" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="prismGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="16" result="blur" />
      <feFlood flood-color="#8B5CF6" flood-opacity="0.45" result="glowColor" />
      <feComposite in="glowColor" in2="blur" operator="in" result="glowComposite" />
      <feMerge>
        <feMergeNode in="glowComposite" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="barGlow" x="-30%" y="-20%" width="160%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="24" y="24" width="464" height="464" rx="104" ry="104" fill="url(#bgGrad)" stroke="url(#squircleStroke)" stroke-width="4" />

  <!-- Inner Ambient Glow Behind Prism -->
  <ellipse cx="256" cy="256" rx="150" ry="130" fill="#6D28D9" opacity="0.18" />
  <ellipse cx="320" cy="270" rx="90" ry="70" fill="#00E5FF" opacity="0.12" />

  <!-- 3D Prism Play Button Group -->
  <g filter="url(#prismGlow)">
    <!-- 1. Left Facet -->
    <polygon points="136,326 136,190 208,136 208,380" fill="url(#leftFacet)" />

    <!-- Left Facet Top Edge Highlight -->
    <line x1="136" y1="190" x2="208" y2="136" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="2.5" />
    <line x1="136" y1="190" x2="136" y2="326" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="2" />

    <!-- 2. Center Face -->
    <polygon points="208,136 304,204 304,312 208,380" fill="url(#centerFacet)" />

    <!-- Center Top Ridge Specular -->
    <line x1="208" y1="136" x2="304" y2="204" stroke="url(#topBevel)" stroke-width="3.5" stroke-linecap="round" />
    <line x1="208" y1="136" x2="208" y2="380" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="2" />

    <!-- 3. Forward Arrow Tip Facet -->
    <polygon points="304,204 388,256 388,260 304,312" fill="url(#rightFacet)" />

    <!-- Arrow Tip Edge Highlights -->
    <line x1="304" y1="204" x2="388" y2="256" stroke="#BAE6FD" stroke-width="3" stroke-linecap="round" />
    <line x1="388" y1="260" x2="304" y2="312" stroke="#38BDF8" stroke-opacity="0.6" stroke-width="2" stroke-linecap="round" />
    <line x1="304" y1="204" x2="304" y2="312" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="2" />
  </g>

  <!-- Equalizer Audio Waveform Bars (Crisp Overlay) -->
  <g filter="url(#barGlow)">
    <!-- Bar 1: Left -->
    <rect x="180" y="210" width="16" height="96" rx="8" ry="8" fill="#FFFFFF" />

    <!-- Bar 2: Center Primary Peak -->
    <rect x="246" y="174" width="18" height="168" rx="9" ry="9" fill="#FFFFFF" />

    <!-- Bar 3: Right Mid -->
    <rect x="278" y="212" width="16" height="92" rx="8" ry="8" fill="#F1F5F9" />

    <!-- Bar 4: Tip Cyan Bar -->
    <rect x="338" y="234" width="14" height="50" rx="7" ry="7" fill="#00E5FF" />
  </g>
</svg>
