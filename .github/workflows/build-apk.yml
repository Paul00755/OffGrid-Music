name: Build and Release Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

env:
  JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Environment and Persistent Keystore
        run: |
          # 1. Ensure .env exists for Secrets Gradle Plugin
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi

          # 2. Materialize the permanent deterministic debug.keystore so EVERY build
          #    (past, present, and future) shares the exact same signing certificate.
          if [ -f debug.keystore.base64 ]; then
            echo "Restoring persistent debug.keystore from debug.keystore.base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          else
            echo "Restoring embedded permanent debug.keystore..."
            cat << 'EOF' | base64 -d > debug.keystore
          
          EOF
          fi

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x gradlew

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug \
            -PversionNameSuffix="-build.${{ github.run_number }}" \
            -Pkotlin.compiler.execution.strategy=daemon \
            -Pksp.useKSP2=true \
            --no-configuration-cache \
            -Dorg.gradle.jvmargs="-Xmx3584m -XX:MaxMetaspaceSize=1024m -Djava.awt.headless=true" \
            --stacktrace

      - name: Prepare OffGrid Music.apk
        run: |
          COMPILED_APK=$(find app/build/outputs/apk/debug -maxdepth 1 -name "*.apk" | head -n 1)
          if [ -z "$COMPILED_APK" ] || [ ! -f "$COMPILED_APK" ]; then
            echo "Error: No APK found in app/build/outputs/apk/debug/"
            exit 1
          fi
          echo "Found compiled APK: $COMPILED_APK"
          APK_DIR=$(dirname "$COMPILED_APK")
          TARGET_APK="$APK_DIR/OffGrid Music.apk"
          if [ "$COMPILED_APK" != "$TARGET_APK" ]; then
            cp "$COMPILED_APK" "$TARGET_APK"
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OffGrid-Music-APK
          path: app/build/outputs/apk/debug/OffGrid Music.apk
          retention-days: 30

      - name: Publish GitHub Release (Latest & Versioned APK)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. Target the prepared APK
          APK_PATH="app/build/outputs/apk/debug/OffGrid Music.apk"
          if [ ! -f "$APK_PATH" ]; then
            APK_PATH=$(find app/build/outputs/apk/debug -maxdepth 1 -name "*.apk" | head -n 1)
          fi
          echo "Using release APK: $APK_PATH"

          # 2. Configure git bot for tagging
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 3. Force-update the 'latest' git tag to this exact commit
          git tag -f latest "${{ github.sha }}"
          git push -f origin latest || true

          # 4. Create or update the 'latest' release using GitHub CLI
          if gh release view latest >/dev/null 2>&1; then
            echo "Release 'latest' exists. Updating APK asset with --clobber..."
            gh release upload latest "$APK_PATH" --clobber
            gh release edit latest \
              --title "OffGrid Music - Latest Version" \
              --notes "### 🚀 Automated Latest APK Build"$'\n\n'"- **Commit**: \`${{ github.sha }}\`"$'\n'"- **Branch**: \`${{ github.ref_name }}\`"$'\n'"- **Build**: \`#${{ github.run_number }}\`"$'\n\n'"Download **OffGrid Music.apk** below to install over your existing app (retains all data)." \
              --target "${{ github.sha }}" \
              --latest
          else
            echo "Creating initial 'latest' release..."
            gh release create latest "$APK_PATH" \
              --title "OffGrid Music - Latest Version" \
              --notes "### 🚀 Automated Latest APK Build"$'\n\n'"- **Commit**: \`${{ github.sha }}\`"$'\n'"- **Branch**: \`${{ github.ref_name }}\`"$'\n'"- **Build**: \`#${{ github.run_number }}\`"$'\n\n'"Download **OffGrid Music.apk** below to install over your existing app (retains all data)." \
              --target "${{ github.sha }}" \
              --latest
          fi

          # 5. Also create an immutable versioned release for this build run
          RUN_TAG="build-${{ github.run_number }}"
          echo "Publishing versioned release $RUN_TAG..."
          gh release create "$RUN_TAG" "$APK_PATH" \
            --title "OffGrid Music Build #${{ github.run_number }}" \
            --notes "Automated build for commit \`${{ github.sha }}\` on branch \`${{ github.ref_name }}\`. Can be installed directly over newer or older builds while retaining all user data." \
            --target "${{ github.sha }}" || true