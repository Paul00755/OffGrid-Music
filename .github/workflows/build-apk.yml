name: Build and Release Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

env:
  JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Environment and Persistent Keystore
        run: |
          # 1. Ensure .env exists for Secrets Gradle Plugin
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi

          # 2. Materialize the permanent deterministic debug.keystore so EVERY build
          #    (past, present, and future) shares the exact same signing certificate.
          if [ -f debug.keystore.base64 ]; then
            echo "Restoring persistent debug.keystore from debug.keystore.base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          else
            echo "Restoring embedded permanent debug.keystore..."
            cat << 'KEYEOF' | base64 -d > debug.keystore
          
          KEYEOF
          fi

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x gradlew

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug \
            -PversionNameSuffix="-build.${{ github.run_number }}" \
            -Pkotlin.compiler.execution.strategy=daemon \
            -Pksp.useKSP2=true \
            --no-configuration-cache \
            -Dorg.gradle.jvmargs="-Xmx3584m -XX:MaxMetaspaceSize=1024m -Djava.awt.headless=true" \
            --stacktrace

      - name: Prepare APK Assets (Clean & Legacy Names + Build Info)
        run: |
          COMPILED_APK=$(find app/build/outputs/apk/debug -maxdepth 1 -name "*.apk" | head -n 1)
          if [ -z "$COMPILED_APK" ] || [ ! -f "$COMPILED_APK" ]; then
            echo "Error: No APK found in app/build/outputs/apk/debug/"
            exit 1
          fi
          echo "Found compiled APK: $COMPILED_APK"
          APK_DIR=$(dirname "$COMPILED_APK")

          # 1. Clean URL-safe APK name (no spaces -> GitHub never renames it, zero 404 errors!)
          CLEAN_APK="$APK_DIR/OffGrid-Music.apk"
          cp "$COMPILED_APK" "$CLEAN_APK"

          # 2. Versioned APK name for easy identification in historical releases
          VERSIONED_APK="$APK_DIR/OffGrid-Music-v1.0.4-build.${{ github.run_number }}.apk"
          cp "$COMPILED_APK" "$VERSIONED_APK"

          # 3. Also keep 'OffGrid Music.apk' for artifact upload compatibility
          SPACE_APK="$APK_DIR/OffGrid Music.apk"
          if [ "$COMPILED_APK" != "$SPACE_APK" ]; then
            cp "$COMPILED_APK" "$SPACE_APK"
          fi

          # 4. Compute SHA-256 and APK size for release notes
          APK_SHA256=$(sha256sum "$CLEAN_APK" | awk '{print $1}')
          APK_SIZE=$(du -h "$CLEAN_APK" | awk '{print $1}')
          echo "APK_SHA256=$APK_SHA256" >> $GITHUB_ENV
          echo "APK_SIZE=$APK_SIZE" >> $GITHUB_ENV

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OffGrid-Music-APK
          path: |
            app/build/outputs/apk/debug/OffGrid-Music.apk
            app/build/outputs/apk/debug/OffGrid Music.apk
          retention-days: 30

      - name: Publish GitHub Releases (Immutable Version History + Latest Release)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK_DIR="app/build/outputs/apk/debug"
          CLEAN_APK="$APK_DIR/OffGrid-Music.apk"
          VERSIONED_APK="$APK_DIR/OffGrid-Music-v1.0.4-build.${{ github.run_number }}.apk"
          SPACE_APK="$APK_DIR/OffGrid Music.apk"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          COMMIT_MSG=$(git log -1 --pretty=%s)
          BUILD_DATE=$(date -u +"%Y-%m-%d %H:%M UTC")
          VERSION_TAG="v1.0.4-build.${{ github.run_number }}"

          # ------------------------------------------------------------------------------
          # 1. Create a permanent versioned release on the Releases page so ALL older
          #    versions remain listed, browsable, and downloadable forever!
          # ------------------------------------------------------------------------------
          cat << EOF > release_notes_versioned.md
          ## 🎵 OffGrid Music — v1.0.4 (Build #${{ github.run_number }})

          ### 📥 Direct APK Downloads
          - **[⬇️ Download OffGrid-Music.apk (Universal Direct Link)](https://github.com/${{ github.repository }}/releases/download/${VERSION_TAG}/OffGrid-Music.apk)**
          - **[⬇️ Download OffGrid-Music-v1.0.4-build.${{ github.run_number }}.apk (Versioned APK)](https://github.com/${{ github.repository }}/releases/download/${VERSION_TAG}/OffGrid-Music-v1.0.4-build.${{ github.run_number }}.apk)**

          ---

          ### 📋 Build & Package Details
          | Property | Value |
          | :--- | :--- |
          | **Version** | \`1.0.4-build.${{ github.run_number }}\` (\`versionCode = 5\`) |
          | **Package ID** | \`com.aistudio.offgridmusic.player\` |
          | **Commit** | [\`${SHORT_SHA}\`](https://github.com/${{ github.repository }}/commit/${{ github.sha }}) — ${COMMIT_MSG} |
          | **Branch** | \`${{ github.ref_name }}\` |
          | **Built On** | ${BUILD_DATE} |
          | **APK Size** | ${APK_SIZE} |
          | **SHA-256** | \`${APK_SHA256}\` |

          ---

          ### 🔄 Seamless Upgrade & Downgrade Support (Retains All Data)
          - **In-Place Updates**: Signed with the repository's permanent certificate — installs directly over any existing OffGrid Music installation without conflicting package errors or creating duplicate apps.
          - **Install Older or Newer Versions Anytime**: Because \`versionCode\` is locked across builds, you can install this build over a newer or older release at any time while keeping all your playlists, favorites, lyrics, and settings intact.
          EOF

          git tag -f "$VERSION_TAG" "${{ github.sha }}"
          git push -f origin "$VERSION_TAG" || true

          if gh release view "$VERSION_TAG" >/dev/null 2>&1; then
            gh release upload "$VERSION_TAG" "$CLEAN_APK" "$VERSIONED_APK" "$SPACE_APK" --clobber
            gh release edit "$VERSION_TAG" \
              --title "OffGrid Music v1.0.4 (Build #${{ github.run_number }})" \
              --notes-file release_notes_versioned.md \
              --target "${{ github.sha }}" \
              --latest
          else
            gh release create "$VERSION_TAG" "$CLEAN_APK" "$VERSIONED_APK" "$SPACE_APK" \
              --title "OffGrid Music v1.0.4 (Build #${{ github.run_number }})" \
              --notes-file release_notes_versioned.md \
              --target "${{ github.sha }}" \
              --latest
          fi

          # ------------------------------------------------------------------------------
          # 2. Also maintain the rolling 'latest' tag release so both:
          #    - /releases/latest/download/OffGrid-Music.apk
          #    - /releases/download/latest/OffGrid-Music.apk
          #    always work without ever returning 404 Not Found!
          # ------------------------------------------------------------------------------
          cat << EOF > release_notes_latest.md
          ## 🚀 OffGrid Music — Latest Automated Release (Build #${{ github.run_number }})

          ### 📥 One-Click Direct Download
          - **[⬇️ Download Latest APK (OffGrid-Music.apk)](https://github.com/${{ github.repository }}/releases/latest/download/OffGrid-Music.apk)**

          ---

          ### 📋 Latest Build Summary
          | Property | Value |
          | :--- | :--- |
          | **Version** | \`1.0.4-build.${{ github.run_number }}\` (\`versionCode = 5\`) |
          | **Commit** | [\`${SHORT_SHA}\`](https://github.com/${{ github.repository }}/commit/${{ github.sha }}) — ${COMMIT_MSG} |
          | **Built On** | ${BUILD_DATE} |
          | **APK Size** | ${APK_SIZE} |
          | **SHA-256** | \`${APK_SHA256}\` |

          > 💡 **Looking for an older version?** Visit the **[All Releases Page](https://github.com/${{ github.repository }}/releases)** to browse and download any previous build (\`v1.0.4-build.X\`). Every historical APK is signed with the same certificate and can be installed directly over your current app without losing data.
          EOF

          git tag -f latest "${{ github.sha }}"
          git push -f origin latest || true

          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest "$CLEAN_APK" "$VERSIONED_APK" "$SPACE_APK" --clobber
            gh release edit latest \
              --title "OffGrid Music — Latest Channel (Build #${{ github.run_number }})" \
              --notes-file release_notes_latest.md \
              --target "${{ github.sha }}" \
              --latest=false
          else
            gh release create latest "$CLEAN_APK" "$VERSIONED_APK" "$SPACE_APK" \
              --title "OffGrid Music — Latest Channel (Build #${{ github.run_number }})" \
              --notes-file release_notes_latest.md \
              --target "${{ github.sha }}" \
              --latest=false
          fi

          # Explicitly ensure the newest versioned release holds the official 'Latest' badge
          gh release edit "$VERSION_TAG" --latest || true