name: Publish Release & Update Notification

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to announce (e.g. v1.0.4-build.20 or v1.1.0)'
        required: true
        type: string

permissions:
  contents: write

env:
  JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  notify-update:
    name: Verify Artifact & Broadcast Update
    runs-on: ubuntu-24.04
    # Only notify for published, non-draft, non-prerelease stable releases
    if: (!github.event.release.draft && !github.event.release.prerelease && github.event.release.tag_name != 'latest') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Determine Release Tag and Details
        id: release_info
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.release_tag }}"
          else
            TAG="${{ github.event.release.tag_name }}"
          fi
          if [ -z "$TAG" ] || [ "$TAG" = "latest" ]; then
            echo "Skipping non-versioned tag: $TAG"
            exit 0
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "Processing release tag: $TAG"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Check Existing Release Artifacts
        id: check_artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Checking if APK assets exist on release $TAG..."
          ASSETS=$(gh release view "$TAG" --json assets -q '.assets[].name' 2>/dev/null || echo "")
          echo "Found assets: $ASSETS"
          if echo "$ASSETS" | grep -qi "\.apk$"; then
            echo "has_apk=true" >> "$GITHUB_OUTPUT"
            echo "Release already contains an APK artifact."
          else
            echo "has_apk=false" >> "$GITHUB_OUTPUT"
            echo "No APK artifact found on release. Building APK now..."
          fi

      - name: Build and Attach APK (if not attached)
        if: steps.check_artifacts.outputs.has_apk != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "::remove-matcher owner=java::"
          if [ ! -f .env ]; then
            cp .env.example .env 2>/dev/null || touch .env
          fi
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          chmod +x gradlew
          ./gradlew assembleDebug \
            -Pkotlin.compiler.execution.strategy=daemon \
            -Pksp.useKSP2=true \
            --no-configuration-cache \
            -Dorg.gradle.jvmargs="-Xmx3584m -XX:MaxMetaspaceSize=1024m -Djava.awt.headless=true"

          COMPILED_APK=$(find app/build/outputs/apk/debug -maxdepth 1 -name "*.apk" | head -n 1)
          if [ -n "$COMPILED_APK" ] && [ -f "$COMPILED_APK" ]; then
            CLEAN_APK="app/build/outputs/apk/debug/OffGrid-Music.apk"
            cp "$COMPILED_APK" "$CLEAN_APK"
            gh release upload "$TAG" "$CLEAN_APK" --clobber
            echo "Successfully attached $CLEAN_APK to release $TAG"
          else
            echo "Error: APK build did not produce an APK file."
            exit 1
          fi

      - name: Broadcast FCM Update Notification to Subscribers
        id: send_fcm
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python3 .github/scripts/send_fcm_release_notification.py
