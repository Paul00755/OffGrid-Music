name: Publish Release & Update Notification

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to announce (e.g. v1.0.4-build.20 or v1.1.0)'
        required: true
        type: string

permissions:
  contents: write

env:
  JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  notify-update:
    name: Verify Artifact & Broadcast Update
    runs-on: ubuntu-24.04
    # Only notify for published, non-draft, non-prerelease stable releases (never test/prerelease tags or non-main manual runs)
    if: ((!github.event.release.draft && !github.event.release.prerelease && github.event.release.tag_name != 'latest' && !contains(github.event.release.tag_name, '-test') && !contains(github.event.release.tag_name, '-alpha') && !contains(github.event.release.tag_name, '-beta') && !contains(github.event.release.tag_name, '-rc') && !contains(github.event.release.tag_name, '-dev')) || (github.event_name == 'workflow_dispatch' && (github.ref_name == 'main' || github.ref_name == 'master')))

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Determine Release Tag and Details
        id: release_info
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.release_tag }}"
          else
            TAG="${{ github.event.release.tag_name }}"
          fi
          if [ -z "$TAG" ] || [ "$TAG" = "latest" ] || echo "$TAG" | grep -qiE '(^|[-._])(alpha|beta|rc[0-9]*|dev|nightly|canary|prerelease|test)($|[-._0-9])'; then
            echo "Skipping non-production or pre-release/test tag: $TAG"
            echo "skip_release=true" >> "$GITHUB_OUTPUT"
            echo "IS_PRODUCTION_RELEASE=false" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "skip_release=false" >> "$GITHUB_OUTPUT"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "Processing release tag: $TAG"

      - name: Check Existing Release Artifacts
        id: check_artifacts
        if: steps.release_info.outputs.skip_release != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Checking if APK assets exist on release $TAG..."
          ASSETS=$(gh release view "$TAG" --json assets -q '.assets[].name' 2>/dev/null || echo "")
          echo "Found assets: $ASSETS"
          if echo "$ASSETS" | grep -qi "\.apk$"; then
            echo "has_apk=true" >> "$GITHUB_OUTPUT"
            echo "Release already contains an APK artifact."
          else
            echo "has_apk=false" >> "$GITHUB_OUTPUT"
            echo "No APK artifact found on release. Building APK now..."
          fi

      - name: Set up JDK 17 (only if APK build needed)
        if: steps.release_info.outputs.skip_release != 'true' && steps.check_artifacts.outputs.has_apk != 'true'
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build and Attach APK (if not attached)
        if: steps.release_info.outputs.skip_release != 'true' && steps.check_artifacts.outputs.has_apk != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "::remove-matcher owner=java::"
          if [ ! -f .env ]; then
            cp .env.example .env 2>/dev/null || touch .env
          fi
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          chmod +x gradlew
          ./gradlew assembleRelease \
            -PJAM_INVITE_HOST=offgrid-music.web.app \
            -Pkotlin.compiler.execution.strategy=daemon \
            -Pksp.useKSP2=true \
            -x lintVitalRelease \
            --build-cache \
            --parallel \
            --max-workers=4 \
            --no-configuration-cache \
            -Dorg.gradle.jvmargs="-Xmx6g -XX:MaxMetaspaceSize=1536m -XX:+UseParallelGC -Djava.awt.headless=true" \
            -Dkotlin.daemon.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=1024m -XX:+UseParallelGC -Djava.awt.headless=true"

          COMPILED_APK=$(find app/build/outputs/apk/release -maxdepth 1 -name "*.apk" | head -n 1)
          if [ -n "$COMPILED_APK" ] && [ -f "$COMPILED_APK" ]; then
            CLEAN_APK="app/build/outputs/apk/release/OffGrid-Music.apk"
            if [ "$COMPILED_APK" != "$CLEAN_APK" ]; then
              cp "$COMPILED_APK" "$CLEAN_APK"
            fi
            for attempt in 1 2 3 4; do
              if gh release upload "$TAG" "$CLEAN_APK" --clobber; then
                echo "Successfully attached $CLEAN_APK to release $TAG"
                break
              fi
              if [ "$attempt" -eq 4 ]; then
                echo "Error: Failed to upload APK after 4 attempts."
                exit 1
              fi
              sleep $((attempt * 4))
            done
          else
            echo "Error: APK build did not produce an APK file."
            exit 1
          fi

      - name: Broadcast FCM Update Notification to Subscribers
        id: send_fcm
        if: steps.release_info.outputs.skip_release != 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 .github/scripts/send_fcm_release_notification.py
